name: Test and Build Anna Executa
on:
  push:
    branches: [main, feature/anna-control-center]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cd anna-app && npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: anna-home-assistant-executa-linux-x86_64
          path: dist/*.tar.gz
