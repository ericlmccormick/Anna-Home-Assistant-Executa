name: Test and Build Anna Executa
on:
  push:
    branches: [main, feature/anna-control-center]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cd anna-app && npm test && npm run build
      - name: Package Anna companion App
        run: tar -C anna-app -czf dist/home-assistant-anna-app-0.3.0-alpha.1.tar.gz app.json manifest.json bundle executas

      - uses: actions/upload-artifact@v4
        with:
          name: anna-home-assistant-0.3.0-alpha.1-preview
          path: dist/*.tar.gz
