name: Test and Build Anna Executa
on:
  push:
    branches: [main, feature/anna-control-center, fix/anna-review-2026-11]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cd anna-app && npm test && npm run build
      - name: Package Anna companion App
        run: |
          version=$(node -p 'require("./anna-app/package.json").version')
          tar -C anna-app -czf "dist/home-assistant-anna-app-${version}.tar.gz" app.json manifest.json bundle executas

      - name: Smoke-test actual cloud distribution package
        run: bash scripts/smoke-cloud-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anna-home-assistant-review-0.1.3
          path: dist/*.tar.gz
